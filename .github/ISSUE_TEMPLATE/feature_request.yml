name: Feature request
description: Suggest a new tool or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want your agent to do?
      description: The task, and what's missing or frustrating today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How should it work?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Area
      options:
        - Search
        - Transcripts
        - Video details, comments or frames
        - Channels and playlists
        - Downloads, clips and reels
        - Setup and sign-in
        - Support for another agent
        - Documentation
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Anything else
